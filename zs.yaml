# zs.yaml — manifesto da aplicação demo para a ZeroServer Community Cloud.
# Dois serviços: db (Postgres) + api (Node). A api é exposed e recebe a URL pública.
# Referência completa: docs/zs-yaml-reference.md
app: zsc-app-demo

# --- Alternativa: Managed Database (recomendado para dados que importam) ---
# Em vez do serviço `db` abaixo (Postgres unmanaged, volume sem replicação),
# crie um banco gerenciado com `zs db create my-pg --engine postgres` e anexe-o
# à app com o campo app-level `database`. A plataforma injeta DATABASE_URL e
# DATABASE_* em todos os serviços (vencem qualquer DATABASE_* do manifesto) e
# sobe a app no mesmo node do banco (colocation é constraint dura).
# Se usar esta variante, remova o serviço `db` e o `dependsOn` abaixo.
#
# database: my-pg

# Descomente e ajuste se sua aplicação precisar de recursos de IA/ML no node.
# Exemplo: app de geração de imagem que exige GPU.
# ai:
#   gpu: true
#   image: true
#   llm: false
#   video: false
#   audio: false

services:
  - name: db
    image: postgres:16-alpine
    env:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app
    volumes:
      # Volume nomeado: sem replicação no MVP, não use para dados críticos.
      - pgdata:/var/lib/postgresql/data

  - name: api
    # Publique sua imagem num registry e troque por ela (ex.: ghcr.io/<org>/zsc-app-demo-api:1.0).
    image: ghcr.io/zeroserver-cc/zsc-app-demo-api:1.0
    env:
      # A api fala com o Postgres pelo nome do serviço `db` na rede privada da app.
      - DATABASE_URL=postgres://postgres:secret@db:5432/app
    ports:
      - "3000"
    dependsOn:
      - db
    exposed: true
